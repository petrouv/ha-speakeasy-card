<!doctype html>
<!-- Stand for the README screenshots, driven by shoot.py. Not part of the card. -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
    /* Home Assistant default theme tokens (light / dark) */
    .theme-light {
        --primary-color: #009ac7;
        --primary-background-color: #fafafa;
        --card-background-color: #ffffff;
        --ha-card-background: #ffffff;
        --primary-text-color: #141414;
        --secondary-text-color: #5e5e5e;
        --disabled-color: #bdbdbd;
        --divider-color: rgba(0, 0, 0, 0.12);
        --success-color: #43a047;
        --error-color: #db4437;
    }
    .theme-dark {
        --primary-color: #009ac7;
        --primary-background-color: #111111;
        --card-background-color: #1c1c1c;
        --ha-card-background: #1c1c1c;
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --disabled-color: #6f6f6f;
        --divider-color: rgba(225, 225, 225, 0.12);
        --success-color: #43a047;
        --error-color: #db4437;
        color-scheme: dark;
    }
    html, body { margin: 0; }
    body { font-family: Roboto, Noto, sans-serif; --ha-font-family-body: Roboto, Noto, sans-serif; }
    .stage {
        display: inline-block;
        padding: 24px;
        background: var(--primary-background-color);
        color: var(--primary-text-color);
    }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<!-- module scripts run in document order: the card is defined before the stand code below -->
<script type="module" src="../../speakeasy-card.js"></script>
<script type="module">
// icons.js is not a file: shoot.py serves the MDI paths of every icon in src/ and scenes.js
import {ICONS} from './icons.js';
import {SCENES} from './scenes.js';

// --- minimal stand-ins for the Home Assistant frontend elements the card uses ---
customElements.define('ha-card', class extends HTMLElement {
    constructor() {
        super();
        this.attachShadow({mode: 'open'}).innerHTML = `<style>
            :host { display: block; background: var(--ha-card-background, var(--card-background-color));
                    border: 1px solid var(--divider-color); border-radius: 12px; overflow: hidden;
                    color: var(--primary-text-color); }
        </style><slot></slot>`;
    }
});
customElements.define('ha-icon', class extends HTMLElement {
    static get observedAttributes() { return ['icon']; }
    constructor() {
        super();
        this.attachShadow({mode: 'open'}).innerHTML = `<style>
            :host { display: inline-flex; align-items: center; justify-content: center; vertical-align: middle;
                    width: var(--mdc-icon-size, 24px); height: var(--mdc-icon-size, 24px); }
            svg { width: 100%; height: 100%; fill: currentColor; }
        </style><svg viewBox="0 0 24 24"><path></path></svg>`;
    }
    get icon() { return this.getAttribute('icon'); }
    set icon(value) { this.setAttribute('icon', value); }
    attributeChangedCallback() {
        const d = ICONS[this.icon];
        if (!d && this.icon) console.warn('missing icon', this.icon);
        this.shadowRoot.querySelector('path').setAttribute('d', d || '');
    }
});
customElements.define('ha-circular-progress', class extends HTMLElement {});

// --- the card with the WebRTC stream replaced by a still frame ---
const Card = customElements.get('speakeasy-card');
class DemoCard extends Card {
    get hasAudio() { return !!this.scene.audio; }
    onconnect() {
        if (this._demoStarted || !this.isConnected) return false;
        this._demoStarted = true;
        const img = new Image();
        img.onload = () => {
            const [x, y, w, h] = this.scene.crop || [0, 0, img.naturalWidth, img.naturalHeight];
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            const draw = () => { ctx.drawImage(img, x, y, w, h, 0, 0, w, h); requestAnimationFrame(draw); };
            draw();
            this.video.srcObject = canvas.captureStream(15);
            this.video.muted = false;
            this.video.play().catch(() => { this.video.muted = true; return this.video.play(); });
            this.setStatus('RTC', '');
            if (this.scene.talk) this.setTalkState(this.scene.talk);
        };
        img.src = this.scene.frame;
        return true;
    }
    ondisconnect() {}
}
customElements.define('speakeasy-demo', DemoCard);

function fakeHass(scene) {
    const states = {};
    for (const [entity, value] of Object.entries(scene.states)) {
        let [state, attributes] = Array.isArray(value) ? value : [value, {}];
        if (typeof state === 'function') state = state();
        states[entity] = {entity_id: entity, state, attributes: {friendly_name: entity, ...attributes}};
    }
    return {
        states,
        language: 'en',
        locale: {language: 'en'},
        themes: {darkMode: scene.theme === 'dark'},
        // `recording` (seconds ago) stands in for the Speakeasy integration; without it there is none
        config: {components: scene.recording === undefined ? [] : ['speakeasy']},
        callService: async () => {},
        callWS: msg => {
            if (msg.type !== 'speakeasy/info') return new Promise(() => {});
            return Promise.resolve({version: '0.1.0', protocol: 1, features: ['record'], configured: true});
        },
        connection: {
            addEventListener: () => {},
            removeEventListener: () => {},
            subscribeMessage: async callback => {
                const source = scene.config.entity ? {entity: scene.config.entity} : {url: scene.config.streams[0].url};
                const started_at = new Date(Date.now() - scene.recording * 1000).toISOString();
                callback({event: 'list', configured: true, recordings: [{id: 'demo', name: 'demo', source, started_at, status: 'recording', reason: null}]});
                return () => {};
            },
        },
        hassUrl: path => location.origin + path,
    };
}

const name = new URLSearchParams(location.search).get('scene');
const scene = SCENES[name];
const stage = document.getElementById('stage');
document.documentElement.className = 'theme-' + scene.theme;
stage.style.width = scene.width + 'px';

const storageKey = 'speakeasy-card:panel:' + (scene.config.entity || scene.config.url || '');
try { localStorage.setItem(storageKey, scene.panel ? '1' : '0'); } catch (e) {}

const card = document.createElement('speakeasy-demo');
card.scene = scene;
card.setConfig(scene.config);
card.hass = fakeHass(scene);
stage.appendChild(card);
card.hass = fakeHass(scene);   // HA sets hass again once the card is in the DOM

window.waitReady = () => new Promise(resolve => {
    const check = () => {
        const video = card.shadowRoot && card.shadowRoot.querySelector('video');
        if (video && video.readyState >= 2 && video.videoWidth) resolve(true);
        else setTimeout(check, 100);
    };
    check();
});
</script>
</body>
</html>
